# Codex 전역 설정 `~/.codex/config.toml`에 반영하는 nestlab 항목이다.
# `<NESTLAB>`은 이 저장소 경로, `<PYTHON>`은 Python 실행 파일 경로로 바꾼다.
# 명령 허용·승인 요청·금지 규칙은 `rules/default.rules`에 있다.
# 이 파일의 권한 항목
#   금지: 보안 문서 읽기·쓰기, 세션 경로 밖 접근, ~/.claude·~/.codex 인증 파일 쓰기 (hooks/check_tool_use.py)
#   승인 요청: 그 밖의 ~/.claude·~/.codex 쓰기는 샌드박스가 승인을 요청한다.
# 보안 문서 목록은 `~/.claude/settings.json`의 `permissions.deny` `Read(...)` 항목을 hook이 읽는다.

# workspace-write: 저장소 안 쓰기만 허용하고 네트워크는 끈다.
# rules의 forbidden은 샌드박스와 무관하게 적용되고, 샌드박스 밖 실행은 승인을 묻는다.
# `approvals_reviewer = "auto_review"`는 승인 요청을 사용자 대신 처리하므로 쓰지 않는다.
sandbox_mode = "workspace-write"
approval_policy = "on-request"
# Codex 기본 성격 지시를 끄고 SOUL.md 페르소나만 남긴다.
personality = "none"

[features]
hooks = true
default_mode_request_user_input = true
prefer_mxc = true

# MXC를 지원하면 MXC로, 아니면 elevated 샌드박스로 명령을 실행한다.
[windows]
sandbox = "elevated"

# hook 구성: 역할 주입(SessionStart·SubagentStart), 승인·입력·쓰기 범위·경로 검사(PreToolUse),
# 승인 창 자동 허용(PermissionRequest), 반증 판정 검사·결과 저장(SubagentStop),
# 지침 검사(PostToolUse), 사건 감지(Stop)

[[hooks.SessionStart]]

[[hooks.SessionStart.hooks]]
type = "command"
command = '"<PYTHON>" "<NESTLAB>/hooks/load_agent.py" --include-role --default-role buddy'
commandWindows = '& "<PYTHON>" "<NESTLAB>/hooks/load_agent.py" --include-role --default-role buddy'
additionalContextLimit = 10000
statusMessage = "Nestlab 메인 에이전트 역할 및 공통 지침"

[[hooks.SubagentStart]]

[[hooks.SubagentStart.hooks]]
type = "command"
command = '"<PYTHON>" "<NESTLAB>/hooks/load_agent.py" --include-role'
commandWindows = '& "<PYTHON>" "<NESTLAB>/hooks/load_agent.py" --include-role'
additionalContextLimit = 10000
statusMessage = "Nestlab 서브 에이전트 역할 및 공통 지침"

[[hooks.PreToolUse]]
matcher = "apply_patch|Bash|.*spawn_agent|request_user_input"

[[hooks.PreToolUse.hooks]]
type = "command"
command = '"<PYTHON>" "<NESTLAB>/hooks/check_tool_use.py" --runner codex'
commandWindows = '& "<PYTHON>" "<NESTLAB>/hooks/check_tool_use.py" --runner codex'
timeout = 10
statusMessage = "Nestlab 승인·입력·쓰기 범위 검사"

[[hooks.PermissionRequest]]

[[hooks.PermissionRequest.hooks]]
type = "command"
command = '"<PYTHON>" "<NESTLAB>/hooks/allow_approved_request.py" --runner codex'
commandWindows = '& "<PYTHON>" "<NESTLAB>/hooks/allow_approved_request.py" --runner codex'
timeout = 10
statusMessage = "Nestlab 승인 창 자동 허용"

[[hooks.SubagentStop]]

[[hooks.SubagentStop.hooks]]
type = "command"
command = '"<PYTHON>" "<NESTLAB>/hooks/save_subagent_result.py" --runner codex'
commandWindows = '& "<PYTHON>" "<NESTLAB>/hooks/save_subagent_result.py" --runner codex'
timeout = 10
statusMessage = "Nestlab 결과 원문 저장"

[[hooks.PostToolUse]]
matcher = "apply_patch"

[[hooks.PostToolUse.hooks]]
type = "command"
command = '"<PYTHON>" "<NESTLAB>/tools/check_doc_rule.py" --hook'
commandWindows = '& "<PYTHON>" "<NESTLAB>/tools/check_doc_rule.py" --hook'
timeout = 30
statusMessage = "Nestlab 지침 검사"

[[hooks.PostToolUse]]
matcher = ".*spawn_agent"

[[hooks.PostToolUse.hooks]]
type = "command"
command = '"<PYTHON>" "<NESTLAB>/hooks/return_research_path.py" --runner codex'
commandWindows = '& "<PYTHON>" "<NESTLAB>/hooks/return_research_path.py" --runner codex'
timeout = 10
statusMessage = "Nestlab 조사 문서 경로 반환"

[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = '"<PYTHON>" "<NESTLAB>/hooks/check_invalid_response.py" --runner codex'
commandWindows = '& "<PYTHON>" "<NESTLAB>/hooks/check_invalid_response.py" --runner codex'
timeout = 10
statusMessage = "Nestlab 사건 감지"

[[hooks.Stop.hooks]]
type = "command"
command = '"<PYTHON>" "<NESTLAB>/hooks/check_workflow_response.py" --runner codex'
commandWindows = '& "<PYTHON>" "<NESTLAB>/hooks/check_workflow_response.py" --runner codex'
timeout = 10
statusMessage = "Nestlab 응답 검사"
